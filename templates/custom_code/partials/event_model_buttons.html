
<ul class="nav nav-pills flex-column mt-3" role="tablist" id="tabs">
{% for model in models %}
      <li class="nav-item">
        <a class="nav-link" href="#" hx-get="{% url 'eventmodels:parameters' %}?model={{model.pk}}"
           hx-target="#event-model-parameters-container" hx-swap="innerHTML"
           hx-indicator="#event-model-parameters-progress">{{model.model_type}}</a>
      </li>
    {% empty %}
    <li class="nav-item">
        <a class="nav-link disabled" href="#">No models for this event yet</a>
    </li>
    {% endfor %}
</ul>
