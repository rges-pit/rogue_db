<div id="photometry-plot-container"
     hx-get="{% url 'target-photometry:plot' %}?target={{ target.pk }}"
     hx-trigger="load" hx-swap="innerHTML">
  <div class="text-center my-4" id="photometry-plot-progress">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2">Loading photometry plot&hellip;</p>
  </div>
</div>

<div id="photometry-datalist-container"
     hx-get="{% url 'target-photometry:data' %}?target={{ target.pk }}&phot_page=1"
     hx-trigger="load" hx-swap="innerHTML">
  <div class="text-center my-4" id="photometry-datalist-progress">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2">Loading photometry data&hellip;</p>
  </div>
</div>
