{# custom_code/partials/alert_table_partial.html #}
{% load render_table from django_tables2 %}

{% render_table table %}

{% if not table.data %}
    <div class="alert alert-info mt-3">
        {% if empty_database %}
            There are no alerts in the database.
        {% else %}
            No alerts match those filters.
        {% endif %}
    </div>
{% endif %}
