[tool.poetry]
name = "rogue_db"
version = "0.1.0"
description = "Rogue Planet Database"
authors = ["Rachel Street <rstreet@lco.global>"]
license = "GPL-3.0-only"
readme = "README.md"

[tool.poetry.dependencies]
python = "<3.13,>=3.10.0"
pylima = "1.9.8"
tomtoolkit = ">=3.0.0"
django = "5.2.17"
whitenoise = "5.0.1"
psycopg2 = "^2.9.10"
django-storages = "^1.14.4"
django-allauth = "65.19.1
django-bootstrap5 = "26.2"
django-contrib-comments = "2.2.0"
django-crispy-forms = "2.7"
django-extensions = "3.2.3"
django-filter = "24.3"
django-gravatar2 = "1.4.5"
django-guardian = "2.4.0"
django-htmx = "1.29.0"
django-stubs-ext = "6.1.0"
django-tables2 = "3.0.0"
django-tasks = "0.6.1"
djangorestframework = "3.18.0"
boto3 = "^1.35.9"
cryptography = ">=48.0.1"
requests = ">=2.34.4"
markdown = ">=3.8.1"
certifi = "2026.7.22"

[tool.poetry.group.dev.dependencies]
factory-boy = "2.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
