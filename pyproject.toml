[project]
name = "rogue_db"
version = "0.1.0"
description = "Rogue Planet Database"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "Rachel Street", email = "rstreet@lco.global" }]
requires-python = ">=3.11,<3.14"

# What RogueDB itself needs. The TOM Toolkit brings the whole Django stack (Django, allauth with MFA,
# django-filter, django-tables2, django-tasks, crispy-forms, guardian, DRF, plotly, astropy, numpy...),
# so those aren't repeated here: poetry.lock holds the exact versions of all of it.
dependencies = [
    "tomtoolkit>=3.1,<3.2",
    "django>=5.2.17,<5.3",
    "pylima==1.9.8",
    # Not the PyPI release (2.1.2), which doesn't work with current pandas: this is the commit of the
    # master branch with "fixed pandas version issue"
    "altaipony @ git+https://github.com/ekaterinailin/AltaiPony.git@5434a47ac4f9578c130e44ef7d5598f2a88263e4",
    # Imported by RogueDB's own code
    "numpy",
    "scipy",
    "pandas",
    "astropy",
    "matplotlib",
    "emcee",
    "corner",
    "plotly",
    "pyerfa",
    "requests>=2.34.2",
    # The database driver
    "psycopg2-binary>=2.9.10",
    # Minimum versions for security fixes
    "cryptography>=48.0.1",
    "markdown>=3.8.1",
]

[tool.poetry]
# RogueDB is a Django project, run from a checkout rather than installed as a package
package-mode = false

# aiosmtpd: a local mail server for trying out registration and password-reset emails
[tool.poetry.group.dev.dependencies]
aiosmtpd = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
